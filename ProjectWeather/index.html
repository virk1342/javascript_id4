<!DOCTYPE html>
<html lang="en">

<head>
  <!-- This tells browser we are using UTF-8 -->
  <meta charset="UTF-8">

  <!-- This helps mobile devices scale correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title shown in browser tab -->
  <title>Weather App</title>

  <!-- Connecting CSS file -->
  <link rel="stylesheet" href="Style.css">
</head>

<body>

  <!-- Main box that holds everything -->
  <div class="container">

    <!-- Main heading -->
    <h1>Weather App</h1>

    <!-- Input box where user types city -->
    <input 
      type="text" 
      id="cityInput" 
      placeholder="Enter city name"
    >

    <!-- Button user clicks -->
    <button id="searchBtn">
      Search Weather
    </button>

    <!-- This div will show weather result -->
    <div id="weatherResult">

      <!-- Starting text -->
      Search for a city

    </div>

  </div>

  <!-- Connecting JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
